name: Check for new Switch games

on:
  schedule:
    # Every 30 minutes (UTC). Off the hour mark, where GitHub's scheduler is busiest.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check Finna and post to Discord
        run: python3 check.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save seen games
        if: always()
        run: |
          git add seen_games.json
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seen games: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
